<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salman Calculator</title>
<style>
body { background:#0f0f0f; display:flex; justify-content:center; align-items:center; min-height:100vh; font-family: sans-serif; margin:0; }
.calc { background:#1a1a1a; padding:20px; border-radius:20px; width:300px; box-shadow:0 0 20px #000; border:1px solid #333; }
.display { background:#222; color:white; font-size:32px; text-align:right; padding:15px; border-radius:12px; margin-bottom:15px; min-height:40px; overflow:hidden; border-left:4px solid #00ff88; }
.buttons { display:grid; grid-template-columns: repeat(4, 1fr); gap:10px; }
button { padding:18px; font-size:18px; border:none; border-radius:10px; background:#2a2a2a; color:white; font-weight:bold; }
button:active { transform:scale(0.95); }
.op { background:#ff2d55; }
.eq { background:#00ff88; color:black; grid-column: span 2; }
.clear { background:#444; }
h3 { color:white; text-align:center; margin-top:0; }
h3 span { color:#00ff88; }
</style>
</head>
<body>

<div class="calc">
  <h3>Salman <span>Calculator</span></h3>
  <div class="display" id="display">0</div>
  <div class="buttons">
    <button class="clear" onclick="clearAll()">C</button>
    <button class="clear" onclick="del()">⌫</button>
    <button class="op" onclick="add('%')">%</button>
    <button class="op" onclick="add('/')">/</button>
    
    <button onclick="add('7')">7</button>
    <button onclick="add('8')">8</button>
    <button onclick="add('9')">9</button>
    <button class="op" onclick="add('*')">X</button>
    
    <button onclick="add('4')">4</button>
    <button onclick="add('5')">5</button>
    <button onclick="add('6')">6</button>
    <button class="op" onclick="add('-')">-</button>
    
    <button onclick="add('1')">1</button>
    <button onclick="add('2')">2</button>
    <button onclick="add('3')">3</button>
    <button class="op" onclick="add('+')">+</button>
    
    <button onclick="add('0')">0</button>
    <button onclick="add('.')">.</button>
    <button class="eq" onclick="calc()">=</button>
  </div>
  <p style="text-align:center; color:#555; font-size:11px; margin-top:15px;">Basic Coder - Salman</p>
</div>

<script>
let disp = document.getElementById('display');
function add(v){ if(disp.innerText=='0' || disp.innerText=='Error'){ disp.innerText=v; } else { disp.innerText+=v; } }
function clearAll(){ disp.innerText='0'; }
function del(){ disp.innerText = disp.innerText.slice(0,-1); if(disp.innerText==''){ disp.innerText='0'; } }
function calc(){ try{ disp.innerText = eval(disp.innerText); } catch{ disp.innerText='Error'; } }
</script>

</div>
</body>
</html>
